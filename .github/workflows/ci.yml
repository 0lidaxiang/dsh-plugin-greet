name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '22.19.0'
            harness-version: '0.2.1-rc.5'
          - node-version: '24'
            harness-version: '0.2.1-rc.5'
          - node-version: '24.9.0'
            harness-version: '0.2.2-alpha.2'
          - node-version: '24'
            harness-version: '0.2.2-alpha.2'
          - node-version: '24.9.0'
            harness-version: '0.2.2-rc.1'
          - node-version: '24'
            harness-version: '0.2.2-rc.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Test packed plugin against Harness
        run: npm run test:compat -- ${{ matrix.harness-version }}

  npm12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund
      - run: npm run check
      - run: npm run test:compat -- 0.2.1-rc.5
